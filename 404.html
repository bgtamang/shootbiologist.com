<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Bishal G. Tamang, Ph.D.</title>
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">

    <script>
        (function() {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (saved === null && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-ink: #1a1a1a;
            --color-ink-muted: #7a7a7a;
            --color-paper: #faf9f7;
            --color-accent: #2d5a3d;
            --color-border-strong: rgba(26, 26, 26, 0.15);
        }

        [data-theme="dark"] {
            --color-ink: #e8e6e3;
            --color-ink-muted: #8a8780;
            --color-paper: #141413;
            --color-accent: #5ba872;
            --color-border-strong: rgba(232, 230, 227, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--color-paper);
            color: var(--color-ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        .code {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(4rem, 14vw, 8rem);
            font-weight: 500;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--color-accent);
        }

        h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(1.75rem, 5vw, 2.5rem);
            font-weight: 500;
            margin: 1rem 0 0.5rem;
        }

        p {
            color: var(--color-ink-muted);
            max-width: 42ch;
            margin: 0 auto 2rem;
        }

        a.home {
            display: inline-block;
            padding: 0.75rem 1.75rem;
            border: 1px solid var(--color-border-strong);
            border-radius: 100px;
            color: var(--color-ink);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            transition: border-color 0.3s, color 0.3s;
        }

        a.home:hover,
        a.home:focus-visible {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>This page didn't germinate</h1>
        <p>The page you're looking for doesn't exist, or it has moved. Everything lives on the one page at the root.</p>
        <a class="home" href="/">Back to the site</a>
    </main>
</body>
</html>
